# Landing: an Exact2 app outside the exact2 checkout, which it uses by path
# (../../exact2). Build profiles are injected by exact2's scripts; the patches
# below are generated by `exact new` and checked on every run.
[workspace]
exclude = [".exact/checkout"]
members = ["apple", "web"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[patch.crates-io]
accesskit_windows = { path = ".exact/checkout/vendor/accesskit-windows" }
taffy = { path = ".exact/checkout/vendor/taffy" }
parley = { path = ".exact/checkout/vendor/parley" }
fontique = { path = ".exact/checkout/vendor/fontique" }
wgpu-hal = { path = ".exact/checkout/vendor/wgpu-hal" }
