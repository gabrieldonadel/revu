# Keeps the device registry's Supabase project awake (LLP 0009): a free
# project is paused after 7 days without activity. Once a day the exchange
# rewrites its heartbeat row; a failure here means pushes are at risk.
name: keepalive
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Heartbeat
        run: |
          body=$(curl -fsS --retry 3 --retry-delay 10 https://revu-exchange.expo.app/keepalive)
          echo "$body"
          echo "$body" | grep -q '"ok":true'
